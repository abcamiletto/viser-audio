[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "viser-audio"
version = "0.0.2"
description = "Audio for viser scenes: positional clips, playback control, and streaming."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "viser>=1.1.0,<1.2",
    "numpy>=1.24",
]

[project.urls]
GitHub = "https://github.com/abcamiletto/viser-audio"

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pyright>=1.1.350",
    "ruff>=0.9",
    "playwright>=1.40",
    "pytest-playwright>=0.4",
]

[tool.hatch.build]
# runtime.js is a build artifact of the TypeScript sources, but it is checked
# in and must ship in the wheel.
exclude = [
    "src/viser_audio/client/node_modules",
    "**/__pycache__/**",
]

[tool.hatch.build.targets.sdist]
only-include = ["src/viser_audio"]

[tool.hatch.build.targets.wheel]
packages = ["src/viser_audio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Same test-file basenames under tests/ and tests/e2e/.
addopts = "--import-mode=importlib"

[tool.ruff]
lint.select = ["E", "F", "I"]
lint.ignore = ["E501"]

[tool.pyright]
include = ["src", "examples", "tests"]
