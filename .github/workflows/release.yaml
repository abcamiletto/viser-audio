# Release on version bump: every push to main compares `project.version` in
# pyproject.toml with the one before the push. When it went up, this workflow
# tags the commit, builds the package, publishes it to PyPI via trusted
# publishing (the `pypi` environment; no API tokens involved), and creates a
# GitHub release with auto-generated notes.
#
# To cut a release: bump the version in pyproject.toml and push to main.

name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      bumped: ${{ steps.version.outputs.bumped }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: Detect version bump
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          read_version() {
            uv run --no-project --python 3.12 python -c "import sys, tomllib; print(tomllib.load(sys.stdin.buffer)['project']['version'])"
          }
          new_version=$(read_version < pyproject.toml)
          echo "version=$new_version" >> "$GITHUB_OUTPUT"

          # No readable previous version (first push, or a pyproject.toml
          # without a static version): release whatever is checked in.
          if ! old_version=$(git show "$BEFORE_SHA:pyproject.toml" 2>/dev/null | read_version 2>/dev/null); then
            echo "No version before this push (before=$BEFORE_SHA); releasing $new_version"
            echo "bumped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          bumped=$(uv run --no-project --with packaging python -c \
            'import sys; from packaging.version import Version; print(str(Version(sys.argv[2]) > Version(sys.argv[1])).lower())' \
            "$old_version" "$new_version")
          echo "bumped=$bumped" >> "$GITHUB_OUTPUT"
          echo "Version before push: $old_version; version after push: $new_version; bumped: $bumped"

  release:
    needs: version
    if: needs.version.outputs.bumped == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: Push tag
        run: |
          git fetch --tags
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists"
            exit 0
          fi
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git tag "v$VERSION"
          git push origin "v$VERSION"
      - name: Build
        run: uv build
      - name: Verify wheel contents
        # The browser runtime is served at run time from the installed
        # package; fail the release if it is missing from the wheel.
        run: |
          python3 - <<'PY'
          import glob
          import zipfile

          (wheel,) = glob.glob("dist/*.whl")
          names = zipfile.ZipFile(wheel).namelist()
          for asset in ("runtime.js", "engine.js"):
              assert f"viser_audio/{asset}" in names, f"{asset} missing from {wheel}"
          assert not any("node_modules" in n for n in names), "node_modules leaked into the wheel"
          print(f"{wheel} OK: {len(names)} files")
          PY
      - name: Publish to PyPI
        run: uv publish
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          generate_release_notes: true
          # Not dist/*: uv build also writes dist/.gitignore, which would be
          # uploaded as a release asset.
          files: |
            dist/*.whl
            dist/*.tar.gz
