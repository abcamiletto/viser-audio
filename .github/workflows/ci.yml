name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest tests -q --ignore=tests/e2e

  client:
    # The browser runtime (src/viser_audio/runtime.js) is checked in; make sure
    # it type-checks and that the committed bundle matches the sources.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/viser_audio/client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/viser_audio/client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: git diff --exit-code -- ../runtime.js

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run playwright install chromium --with-deps
      - run: uv run pytest tests/e2e -q
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 30
